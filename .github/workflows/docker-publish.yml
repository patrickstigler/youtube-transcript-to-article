# Build the Docker image and push to GitHub Container Registry (GHCR) and Docker Hub.
#
# GHCR: uses GITHUB_TOKEN — enable "Packages" write permission (see permissions below).
# Docker Hub: add repository secrets DOCKERHUB_TOKEN (required) and optionally
# DOCKERHUB_USERNAME if your Docker Hub login differs from your GitHub username.

name: Publish Docker image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: youtube-transcript-to-article

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: taglist
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          GHCR="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          DH="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ env.IMAGE_NAME }}"
          SHA_SHORT="$(echo '${{ github.sha }}' | cut -c1-7)"
          SHA_TAG="sha-${SHA_SHORT}"

          TAGS="${GHCR}:${SHA_TAG}"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "${{ github.ref }}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
            TAGS="${TAGS}"$'\n'"${GHCR}:latest"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAGS="${TAGS}"$'\n'"${GHCR}:${{ github.ref_name }}"
          fi

          if [ -n "${DOCKERHUB_TOKEN}" ]; then
            TAGS="${TAGS}"$'\n'"${DH}:${SHA_TAG}"
            if [ "${{ github.ref }}" = "refs/heads/${DEFAULT_BRANCH}" ]; then
              TAGS="${TAGS}"$'\n'"${DH}:latest"
            fi
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAGS="${TAGS}"$'\n'"${DH}:${{ github.ref_name }}"
            fi
          fi

          {
            echo 'tags<<EOF'
            echo "${TAGS}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.taglist.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
